; Xdebug only starts when triggered (start "Listen for Xdebug" in VS Code first):
;   Browser: enable the Xdebug helper extension (any IDE key) or add ?XDEBUG_TRIGGER=1 to the URL
;   CLI:     docker compose exec --env XDEBUG_TRIGGER=1 app php <script>
; host.docker.internal needs `extra_hosts: [host.docker.internal:host-gateway]` on Linux.
xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.client_port=9003
xdebug.discover_client_host=0
xdebug.client_host=host.docker.internal

; The same as in production (the official espocrm image, conf.d/espocrm.ini), except showing errors.
memory_limit=256M
max_execution_time=180
max_input_time=180
post_max_size=50M
upload_max_filesize=50M
date.timezone=UTC
